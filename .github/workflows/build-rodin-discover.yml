name: Rodin Discover Native v0.7
on:
  push:
    branches:
      - rodin-discover-native-v07
    paths:
      - 'discover-native/**'
      - '.github/workflows/build-rodin-discover.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discover-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK metadata and native library
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee contents.txt
          grep -q 'lib/arm64-v8a/librodindiscover.so' contents.txt
          grep -q 'META-INF/xposed/module.prop' contents.txt
          grep -q 'META-INF/xposed/scope.list' contents.txt
          grep -q 'META-INF/xposed/native_init.list' contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RodinDiscoverNative-v0.7-debug-EXPERIMENTAL
          path: discover-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
